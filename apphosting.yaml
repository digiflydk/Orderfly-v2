  - variable: FIREBASE_STORAGE_BUCKET
    value: studio-2819118380-ae26c.firebasestorage.app
    availability:
      - RUNTIME
  - variable: FIREBASE_STORAGE_PROJECT_ID
    value: studio-2819118380-ae26c
    availability:
      - RUNTIME
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
