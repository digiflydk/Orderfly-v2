name: Firestore data migration

# Deployment only (#934): GitHub Actions does not run tests; Work runs `npm run ci` before merging.
# After a merge to main that adds or changes scripts/migrations/<name>.mjs, runs each such
# migration against orderfly-39325 with `auto`: plan, print the plan, apply exactly that plan and
# log it in dataMigrationAudit. Migrations are idempotent (scripts/migrations/README.md), so a
# re-run reports nothing to apply. A manual run can preview (read only) or run one migration.
# See docs/firestore-operations.md.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/migrations/*.mjs'
  workflow_dispatch:
    inputs:
      migration:
        description: "Migration name (scripts/migrations/<name>.mjs)"
        required: true
      mode:
        description: "preview (read only) or auto (apply now)"
        type: choice
        options: [preview, auto]
        default: preview

permissions:
  contents: read

concurrency:
  group: firestore-production-writes
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/main' || inputs.mode == 'preview'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run the merged migrations
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          MANUAL: ${{ inputs.migration }}
          MODE: ${{ inputs.mode || 'auto' }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # The first push of a branch has no "before" commit; compare with the parent instead.
          case "$BEFORE" in ""|0000000000000000000000000000000000000000) BEFORE="$AFTER~1";; esac
          if [ -n "$MANUAL" ]; then names="$MANUAL"
          else names=$(git diff --name-only --diff-filter=AM "$BEFORE" "$AFTER" -- 'scripts/migrations/*.mjs' | sed -n 's#^scripts/migrations/\(.*\)\.mjs$#\1#p'); fi
          for name in $names; do
            echo "::group::$name"
            node scripts/firestore-migrate.mjs "$name" "$MODE"
            echo "::endgroup::"
          done
