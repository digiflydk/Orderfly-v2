name: Firestore rules

# Deployment only (#934): GitHub Actions does not run tests; Work runs `npm run ci` before merging.
# After a merge to main that changes the rules file named in firebase.access.json
# (firestore.access.rules), publishes it to orderfly-39325 automatically: `auto` reads the live
# rules, publishes the candidate on top of exactly those and verifies the published hash. Nothing
# is published when the candidate is already live. A manual run can preview (read only) or
# publish. See docs/firestore-operations.md.
on:
  push:
    branches: [main]
    paths:
      - firestore.access.rules
      - firebase.access.json
  workflow_dispatch:
    inputs:
      mode:
        description: "preview (read only) or auto (publish now)"
        type: choice
        options: [preview, auto]
        default: preview

permissions:
  contents: read

concurrency:
  group: firestore-production-writes
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' || inputs.mode == 'preview'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Publish the merged rules
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          MODE: ${{ inputs.mode || 'auto' }}
        run: node scripts/firestore-rules-release.mjs "$MODE"
