name: Work Staging Live Gate

on:
  pull_request_target:
    branches: [develop]
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: read

env:
  STAGING_URL: ${{ vars.ORDERFLY_STAGING_URL }}

jobs:
  live-verify:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve Work-managed issue
        id: context
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const pr = context.payload.pull_request;
            const match = (pr.body || '').match(/Work-Managed-Issue:\s*#(\d+)/);
            if (!match) {
              core.setOutput('managed', 'false');
              return;
            }
            const issueNumber = Number(match[1]);
            const { data: issue } = await github.rest.issues.get({owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber});
            core.setOutput('managed', 'true');
            core.setOutput('issue-number', String(issueNumber));
            core.setOutput('clean-title', issue.title.replace(/^\[[^\]]+\]\s*/, ''));
            await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, title: `[STAGING VERIFY] ${issue.title.replace(/^\[[^\]]+\]\s*/, '')}`});
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, body: `WORK_STAGING_VERIFY: PR #${pr.number} was merged to develop. Waiting for the configured staging environment and running read-only Playwright live checks.`});

      - name: Require staging URL
        if: steps.context.outputs.managed == 'true' && env.STAGING_URL == ''
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.context.outputs.issue-number }}
          CLEAN_TITLE: ${{ steps.context.outputs.clean-title }}
        with:
          github-token: ${{ github.token }}
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, title: `[BLOCKED] ${process.env.CLEAN_TITLE}`});
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, body: 'WORK_AUTOMATION_BLOCKED: Repository variable `ORDERFLY_STAGING_URL` is missing. Configure it with the live develop/App Hosting staging URL, then re-run the Work Staging Live Gate.'});
            core.setFailed('ORDERFLY_STAGING_URL is not configured.');

      - name: Check out merged develop
        if: steps.context.outputs.managed == 'true' && env.STAGING_URL != ''
        uses: actions/checkout@v6
        with:
          ref: develop

      - name: Setup Node.js
        if: steps.context.outputs.managed == 'true' && env.STAGING_URL != ''
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies and Chromium
        if: steps.context.outputs.managed == 'true' && env.STAGING_URL != ''
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Wait for staging endpoint to become healthy
        if: steps.context.outputs.managed == 'true' && env.STAGING_URL != ''
        env:
          URL: ${{ env.STAGING_URL }}
        run: |
          ok=0
          for attempt in $(seq 1 20); do
            code=$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 20 "$URL" || true)
            if [ "$code" -ge 200 ] && [ "$code" -lt 500 ]; then
              ok=1
              break
            fi
            sleep 15
          done
          test "$ok" = "1"

      - name: Create temporary read-only live Playwright test
        if: steps.context.outputs.managed == 'true' && env.STAGING_URL != ''
        run: |
          cat > tests/__work_live_smoke.spec.ts <<'EOF'
          import { test, expect } from '@playwright/test';

          const base = process.env.ORDERFLY_STAGING_URL!;

          test('staging landing page is healthy', async ({ page }) => {
            const errors: string[] = [];
            page.on('pageerror', error => errors.push(error.message));
            const response = await page.goto(base, { waitUntil: 'domcontentloaded' });
            expect(response, 'staging navigation returned no response').not.toBeNull();
            expect(response!.status()).toBeLessThan(500);
            await expect(page.locator('body')).toBeVisible();
            expect(errors, `browser page errors: ${errors.join(' | ')}`).toEqual([]);
          });

          test('public m3pizza surface works on desktop', async ({ page }) => {
            const response = await page.goto(new URL('/m3pizza', base).toString(), { waitUntil: 'domcontentloaded' });
            expect(response).not.toBeNull();
            expect(response!.status()).toBeLessThan(500);
            await expect(page.locator('body')).toBeVisible();
          });

          test('public m3pizza surface has no horizontal overflow on mobile', async ({ page }) => {
            await page.setViewportSize({ width: 375, height: 667 });
            await page.goto(new URL('/m3pizza', base).toString(), { waitUntil: 'domcontentloaded' });
            const overflow = await page.evaluate(() => document.documentElement.scrollWidth > document.documentElement.clientWidth + 1);
            expect(overflow).toBeFalsy();
          });
          EOF
          cat > /tmp/playwright.work-live.config.ts <<'EOF'
          import { defineConfig, devices } from '@playwright/test';
          export default defineConfig({
            testDir: process.cwd() + '/tests',
            testMatch: '__work_live_smoke.spec.ts',
            retries: 2,
            use: { trace: 'on-first-retry' },
            projects: [{ name: 'live-chromium', use: { ...devices['Desktop Chrome'] } }],
          });
          EOF

      - name: Run Playwright against live staging
        if: steps.context.outputs.managed == 'true' && env.STAGING_URL != ''
        env:
          ORDERFLY_STAGING_URL: ${{ env.STAGING_URL }}
        run: npx playwright test --config=/tmp/playwright.work-live.config.ts

      - name: Upload live Playwright diagnostics
        if: always() && steps.context.outputs.managed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: orderfly-staging-playwright-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Mark issue Done after live staging passes
        if: success() && steps.context.outputs.managed == 'true'
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.context.outputs.issue-number }}
          CLEAN_TITLE: ${{ steps.context.outputs.clean-title }}
          STAGING_URL: ${{ env.STAGING_URL }}
        with:
          github-token: ${{ github.token }}
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, body: `WORK_DONE: PO-approved implementation is merged to develop and read-only Playwright live verification passed on ${process.env.STAGING_URL}. Development task is Done. Production promotion to main remains a separate release step.`});
            await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, title: `[DONE] ${process.env.CLEAN_TITLE}`, state: 'closed', state_reason: 'completed'});

      - name: Mark staging verification failure as blocked
        if: failure() && steps.context.outputs.managed == 'true' && env.STAGING_URL != ''
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.context.outputs.issue-number }}
          CLEAN_TITLE: ${{ steps.context.outputs.clean-title }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, title: `[BLOCKED] ${process.env.CLEAN_TITLE}`});
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, body: `WORK_STAGING_BLOCKED: Staging/live Playwright verification failed after merge to develop. Run: ${process.env.RUN_URL}. Do not promote this change to main until the staging issue is resolved.`});
