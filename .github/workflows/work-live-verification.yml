name: Work Live Verification

on:
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  contents: read
  checks: read
  issues: write
  pull-requests: read

env:
  LIVE_URL: ${{ vars.ORDERFLY_LIVE_URL || 'https://orderfly.dk' }}

jobs:
  live-verify:
    # pull_request_target does not honor commit skip directives. Respect the
    # explicit internal-CI release marker before allocating any runner.
    if: github.event.pull_request.merged == true && !contains(github.event.pull_request.title, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Resolve Work-managed issue
        id: context
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const pr = context.payload.pull_request;
            const match = (pr.body || '').match(/Work-Managed-Issue:\s*#(\d+)/);
            if (!match) {
              core.setOutput('managed', 'false');
              return;
            }
            const issueNumber = Number(match[1]);
            const { data: issue } = await github.rest.issues.get({owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber});
            const clean = issue.title.replace(/^\[[^\]]+\]\s*/, '');
            core.setOutput('managed', 'true');
            core.setOutput('issue-number', String(issueNumber));
            core.setOutput('clean-title', clean);
            await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, title: `[AWAITING LIVE VERIFY] ${clean}`});
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, body: `WORK_LIVE_VERIFY: PR #${pr.number} was merged to main (PO acceptance, or the automatic merge rule in AGENTS.md as stated in the merge commit). Running read-only live Playwright health checks. A green smoke run is evidence for PO, not permission for Work to mark Done.`});

      - name: Check out the merge commit
        if: steps.context.outputs.managed == 'true'
        uses: actions/checkout@v6
        with:
          # The merge commit is on main; pinning it keeps a later merge from swapping the gate mid-run.
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Wait for CI and deployment of the merge commit
        id: release
        if: steps.context.outputs.managed == 'true'
        uses: actions/github-script@v7
        env:
          LIVE_URL: ${{ env.LIVE_URL }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { waitForRelease } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/wait-for-release.cjs`);
            const { release } = await waitForRelease({ github, owner: context.repo.owner, repo: context.repo.repo,
              mergeSha: process.env.MERGE_SHA, liveUrl: process.env.LIVE_URL, self: 'live-verify',
              required: ['Typecheck and build', 'rules'], log: core.info });
            core.setOutput('deployed-sha', release);

      - name: Setup Node.js
        if: steps.context.outputs.managed == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies and Chromium
        if: steps.context.outputs.managed == 'true'
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Wait for live endpoint
        if: steps.context.outputs.managed == 'true'
        env:
          URL: ${{ env.LIVE_URL }}
        run: |
          ok=0
          for attempt in $(seq 1 24); do
            code=$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 20 "$URL" || true)
            if [ "$code" -ge 200 ] && [ "$code" -lt 500 ]; then
              ok=1
              break
            fi
            sleep 15
          done
          test "$ok" = "1"

      - name: Create read-only live Playwright checks
        if: steps.context.outputs.managed == 'true'
        run: |
          cat > tests/__work_live_smoke.spec.ts <<'EOF'
          import { test, expect } from '@playwright/test';
          const base = process.env.ORDERFLY_LIVE_URL!;

          test('live landing page is healthy', async ({ page }) => {
            const errors: string[] = [];
            page.on('pageerror', error => errors.push(error.message));
            const response = await page.goto(base, { waitUntil: 'domcontentloaded' });
            expect(response).not.toBeNull();
            expect(response!.status()).toBeLessThan(500);
            await expect(page.locator('body')).toBeVisible();
            expect(errors).toEqual([]);
          });

          test('live public brand surface works on desktop', async ({ page }) => {
            const response = await page.goto(new URL('/m3pizza', base).toString(), { waitUntil: 'domcontentloaded' });
            expect(response).not.toBeNull();
            expect(response!.status()).toBeLessThan(500);
            await expect(page.locator('body')).toBeVisible();
          });

          test('live public brand surface has no horizontal overflow on mobile', async ({ page }) => {
            await page.setViewportSize({ width: 375, height: 667 });
            await page.goto(new URL('/m3pizza', base).toString(), { waitUntil: 'domcontentloaded' });
            const overflow = await page.evaluate(() => document.documentElement.scrollWidth > document.documentElement.clientWidth + 1);
            expect(overflow).toBeFalsy();
          });
          EOF
          cat > playwright.work-live.config.ts <<'EOF'
          import { defineConfig, devices } from '@playwright/test';
          export default defineConfig({
            testDir: process.cwd() + '/tests',
            testMatch: '__work_live_smoke.spec.ts',
            retries: 2,
            use: { trace: 'on-first-retry' },
            projects: [{ name: 'live-chromium', use: { ...devices['Desktop Chrome'] } }],
          });
          EOF

      - name: Run Playwright against live Orderfly
        if: steps.context.outputs.managed == 'true'
        env:
          ORDERFLY_LIVE_URL: ${{ env.LIVE_URL }}
        run: npx playwright test --config=playwright.work-live.config.ts

      - name: Upload live Playwright diagnostics
        if: always() && steps.context.outputs.managed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: orderfly-post-merge-live-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Record green live evidence
        if: success() && steps.context.outputs.managed == 'true'
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.context.outputs.issue-number }}
          LIVE_URL: ${{ env.LIVE_URL }}
          DEPLOYED_SHA: ${{ steps.release.outputs.deployed-sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: Number(process.env.ISSUE_NUMBER), body: `WORK_LIVE_VERIFY_PASSED: Read-only post-merge Playwright smoke passed on ${process.env.LIVE_URL}, which runs ${process.env.DEPLOYED_SHA} (CI green on the merge commit). Run: ${process.env.RUN_URL}. PO must still verify deployment evidence and any issue-specific live acceptance criteria before marking Done.`});

      - name: Mark live verification failure as blocked
        if: failure() && steps.context.outputs.managed == 'true'
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.context.outputs.issue-number }}
          CLEAN_TITLE: ${{ steps.context.outputs.clean-title }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: Number(process.env.ISSUE_NUMBER), title: `[BLOCKED] ${process.env.CLEAN_TITLE}`});
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: Number(process.env.ISSUE_NUMBER), body: `WORK_LIVE_BLOCKED: Post-merge live verification failed (CI on the merge commit, deployment of that commit, or the Playwright smoke). Run: ${process.env.RUN_URL}. The issue is not Done.`});
