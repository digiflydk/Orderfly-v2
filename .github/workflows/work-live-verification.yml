name: Work Live Verification

on:
  repository_dispatch:
    types: [work-live-verify]

permissions:
  contents: read
  issues: write
  pull-requests: read

env:
  LIVE_URL: ${{ vars.ORDERFLY_LIVE_URL || 'https://orderfly.dk' }}
  ISSUE_NUMBER: ${{ github.event.client_payload.issue_number }}
  PR_NUMBER: ${{ github.event.client_payload.pr_number }}
  MERGE_SHA: ${{ github.event.client_payload.merge_sha }}
  DEPLOYMENT_RUN_ID: ${{ github.event.client_payload.deployment_run_id }}
  CONTROLLED_LIVE_VERIFICATION: ${{ github.event.client_payload.controlled_live_verification }}

concurrency:
  group: orderfly-production-release
  cancel-in-progress: false

jobs:
  live-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Validate deployment evidence for exact merge SHA
        id: context
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
          PR_NUMBER: ${{ env.PR_NUMBER }}
          MERGE_SHA: ${{ env.MERGE_SHA }}
          DEPLOYMENT_RUN_ID: ${{ env.DEPLOYMENT_RUN_ID }}
        with:
          github-token: ${{ github.token }}
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const prNumber = Number(process.env.PR_NUMBER);
            const mergeSha = String(process.env.MERGE_SHA || '').toLowerCase();
            const deploymentRun = String(process.env.DEPLOYMENT_RUN_ID || '');
            if (!Number.isInteger(issueNumber) || !Number.isInteger(prNumber) || !/^[0-9a-f]{40}$/.test(mergeSha) || !/^\d+$/.test(deploymentRun)) throw new Error('Invalid deployment-aware live payload.');
            const mainSha = String((await github.rest.git.getRef({ owner: context.repo.owner, repo: context.repo.repo, ref: 'heads/main' })).data.object.sha).toLowerCase();
            if (mainSha !== mergeSha) throw new Error(`Live verification refused: main ${mainSha} does not equal deployed merge ${mergeSha}.`);
            const pr = (await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: prNumber })).data;
            if (!pr.merged || String(pr.merge_commit_sha || '').toLowerCase() !== mergeSha) throw new Error(`PR #${prNumber} does not match deployed merge ${mergeSha}.`);
            const issue = (await github.rest.issues.get({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber })).data;
            if (!issue.title.startsWith('[LIVE VERIFY]')) throw new Error(`Issue #${issueNumber} is not [LIVE VERIFY].`);
            const comments = await github.paginate(github.rest.issues.listComments, { owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, per_page: 100 });
            const evidence = comments.find((comment) => {
              const trusted = ['OWNER', 'MEMBER', 'COLLABORATOR'].includes(String(comment.author_association || '').toUpperCase()) || comment.user?.login === 'github-actions[bot]';
              const body = String(comment.body || '');
              return trusted && body.includes('DEPLOYMENT_SUCCEEDED') && body.includes(`Merge-SHA: ${mergeSha}`) && body.includes(`Deployment-Run: ${deploymentRun}`) && body.includes('App-Hosting-Project: orderfly-v21-10334086-b3076') && body.includes('Data-Project: orderfly-39325');
            });
            if (!evidence) throw new Error('Matching trusted App Hosting deployment evidence was not found.');
            core.setOutput('clean-title', String(issue.title || '').replace(/^\[[^\]]+\]\s*/, ''));

      - name: Check out exact deployed SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ env.MERGE_SHA }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Wait for production endpoint
        run: |
          ok=0
          for attempt in $(seq 1 24); do
            code=$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 20 "$LIVE_URL" || true)
            if [ "$code" -ge 200 ] && [ "$code" -lt 500 ]; then
              ok=1
              break
            fi
            sleep 15
          done
          test "$ok" = "1"

      - name: Run checked-in post-deploy Playwright
        env:
          ORDERFLY_LIVE_URL: ${{ env.LIVE_URL }}
        run: npx playwright test --config=playwright.live.config.ts

      - name: Upload live diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orderfly-post-deploy-${{ env.MERGE_SHA }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 90

      - name: Finalize green release or retain controlled gate
        if: success()
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
          MERGE_SHA: ${{ env.MERGE_SHA }}
          DEPLOYMENT_RUN_ID: ${{ env.DEPLOYMENT_RUN_ID }}
          CONTROLLED_LIVE_VERIFICATION: ${{ env.CONTROLLED_LIVE_VERIFICATION }}
          CLEAN_TITLE: ${{ steps.context.outputs.clean-title }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            if (process.env.CONTROLLED_LIVE_VERIFICATION === 'required') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `CONTROLLED_LIVE_VERIFICATION_REQUIRED\nMerge-SHA: ${process.env.MERGE_SHA}\nDeployment-Run: ${process.env.DEPLOYMENT_RUN_ID}\nGeneric post-deploy Playwright is green. The issue remains [LIVE VERIFY] until its explicit controlled verification is complete.\nRun: ${process.env.RUN_URL}`,
              });
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `LIVE_VERIFICATION_PASSED\nMerge-SHA: ${process.env.MERGE_SHA}\nDeployment-Run: ${process.env.DEPLOYMENT_RUN_ID}\nLive-Run: ${process.env.RUN_URL}\nExact-SHA App Hosting deployment and read-only production Playwright are green.`,
            });
            await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, title: `[DONE] ${process.env.CLEAN_TITLE}`, state: 'closed', state_reason: 'completed' });

      - name: Mark genuine live failure as blocked
        if: failure()
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
          MERGE_SHA: ${{ env.MERGE_SHA }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            if (!Number.isInteger(issueNumber) || issueNumber < 1) return;
            const issue = (await github.rest.issues.get({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber })).data;
            const clean = String(issue.title || '').replace(/^\[[^\]]+\]\s*/, '');
            await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, title: `[BLOCKED] ${clean}` });
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, body: `LIVE_VERIFICATION_BLOCKED\nMerge-SHA: ${process.env.MERGE_SHA}\nPost-deployment production smoke failed.\nRun: ${process.env.RUN_URL}` });
