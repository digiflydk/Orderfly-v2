name: Work Green Release

on:
  issues:
    types: [edited]

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

env:
  ISSUE_NUMBER: ${{ github.event.issue.number }}

concurrency:
  group: orderfly-production-release
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.event.issue.title, '[READY FOR RELEASE]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out trusted release contract
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify current head, CI and manual review, then merge
        id: gate
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { pathToFileURL } = require('node:url');
            const contract = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/release-contract.mjs`).href);
            try {
              const issueNumber = Number(process.env.ISSUE_NUMBER);
              if (!Number.isInteger(issueNumber) || issueNumber < 1) throw new Error('A valid issue number is required.');
              const issue = (await github.rest.issues.get({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber })).data;
              if (!issue.title.startsWith('[READY FOR RELEASE]')) throw new Error(`Issue #${issueNumber} is not [READY FOR RELEASE].`);
              if (!contract.isTrustedAssociation(issue.author_association)) throw new Error(`Issue #${issueNumber} is not trusted.`);

              const openIssues = await github.paginate(github.rest.issues.listForRepo, { owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
              const activeRelease = openIssues.find((candidate) =>
                !candidate.pull_request &&
                Number(candidate.number) !== issueNumber &&
                contract.isTrustedAssociation(candidate.author_association) &&
                /^\[(?:DEPLOYING|LIVE VERIFY)\]/.test(String(candidate.title || '')));
              if (activeRelease) throw new Error(`Persistent release lock: trusted issue #${activeRelease.number} is ${activeRelease.title.match(/^\[[^\]]+\]/)?.[0] || 'active'}.`);

              const pulls = await github.paginate(github.rest.pulls.list, { owner: context.repo.owner, repo: context.repo.repo, state: 'open', base: 'main', per_page: 100 });
              const candidates = pulls.filter((pr) => contract.manualIssueNumber(pr.body) === issueNumber);
              if (candidates.length !== 1) throw new Error(`Expected exactly one open PR linked with Manual-Work-Issue: #${issueNumber}; found ${candidates.length}.`);
              const pr = candidates[0];
              if (pr.draft || pr.base.ref !== 'main') throw new Error(`PR #${pr.number} must be a non-draft PR to main.`);
              if (pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) throw new Error('Release PR head must belong to this repository.');
              if (!contract.isTrustedAssociation(pr.author_association)) throw new Error(`PR #${pr.number} is not authored by a trusted repository participant.`);
              const controlledMode = contract.controlledLiveMode(pr.body);
              if (!controlledMode) throw new Error(`PR #${pr.number} must declare Controlled-Live-Verification: none|required.`);

              const baseSha = String((await github.rest.git.getRef({ owner: context.repo.owner, repo: context.repo.repo, ref: 'heads/main' })).data.object.sha);
              const comparison = await github.request('GET /repos/{owner}/{repo}/compare/{basehead}', {
                owner: context.repo.owner,
                repo: context.repo.repo,
                basehead: `${baseSha}...${pr.head.sha}`,
              });
              if (comparison.data.behind_by !== 0) throw new Error(`PR #${pr.number} is behind current main and must be rebased and reverified.`);

              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'ui-tests.yml',
                event: 'pull_request',
                branch: pr.head.ref,
                per_page: 100,
              });
              const ciRun = contract.selectCiRun(runs, pr);
              if (!ciRun) throw new Error(`No successful Orderfly CI pull-request run matches head ${pr.head.sha}.`);
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: ciRun.id,
                per_page: 100,
              });
              const missing = contract.missingCiJobs(jobs);
              if (missing.length) throw new Error(`Orderfly CI is missing successful required jobs: ${missing.join(', ')}.`);

              const comments = await github.paginate(github.rest.issues.listComments, { owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number, per_page: 100 });
              const review = contract.selectCleanReview(comments, pr.head.sha);
              if (!review) throw new Error(`PR #${pr.number} has no latest trusted MANUAL_CODE_REVIEW: CLEAN marker for head ${pr.head.sha}.`);

              const fresh = (await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number })).data;
              const freshMain = String((await github.rest.git.getRef({ owner: context.repo.owner, repo: context.repo.repo, ref: 'heads/main' })).data.object.sha);
              if (fresh.head.sha !== pr.head.sha || freshMain !== baseSha) throw new Error('PR head or main changed during release validation. Run CI and review again.');
              if (fresh.mergeable !== true) throw new Error(`PR #${pr.number} is not currently mergeable.`);

              const merged = await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                merge_method: 'squash',
                sha: fresh.head.sha,
                commit_title: `Release issue #${issueNumber}: ${contract.cleanIssueTitle(issue.title)}`,
              });
              if (!merged.data.merged || !/^[0-9a-f]{40}$/i.test(merged.data.sha || '')) throw new Error(`GitHub did not confirm merge: ${merged.data.message || 'unknown response'}`);
              const mergeSha = String(merged.data.sha).toLowerCase();
              const newMain = String((await github.rest.git.getRef({ owner: context.repo.owner, repo: context.repo.repo, ref: 'heads/main' })).data.object.sha).toLowerCase();
              if (newMain !== mergeSha) throw new Error(`main does not point to returned merge SHA ${mergeSha}.`);

              const cleanTitle = contract.cleanIssueTitle(issue.title);
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, title: `[DEPLOYING] ${cleanTitle}` });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: [
                  'RELEASE_MERGED',
                  `PR: #${pr.number}`,
                  `Reviewed-Head: ${fresh.head.sha}`,
                  `Merge-SHA: ${mergeSha}`,
                  `Orderfly-CI: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${ciRun.id}`,
                  `Code-Review-Comment: ${review.html_url}`,
                  `Controlled-Live-Verification: ${controlledMode}`,
                  `Release-Run: ${process.env.RUN_URL}`,
                  '',
                  'Firebase App Hosting automatic rollout from main is now expected for this exact merge SHA.',
                  'After the rollout is successful, post APP_HOSTING_ROLLOUT_CONFIRMED evidence on this issue. Live Playwright will not start from merge alone.',
                ].join('\n'),
              });
              core.setOutput('issue-number', String(issueNumber));
            } catch (error) {
              core.setOutput('gate-error', String(error?.message || error).slice(0, 4000));
              core.setFailed(error?.message || String(error));
            }

      - name: Mark release-gate failure as blocked
        if: failure()
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
          GATE_ERROR: ${{ steps.gate.outputs.gate-error }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            if (!Number.isInteger(issueNumber) || issueNumber < 1) return;
            const issue = (await github.rest.issues.get({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber })).data;
            const clean = String(issue.title || '').replace(/^\[[^\]]+\]\s*/, '');
            await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, title: `[BLOCKED] ${clean}` });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `RELEASE_GATE_BLOCKED: ${process.env.GATE_ERROR || 'Release validation failed.'}\nRun: ${process.env.RUN_URL}`,
            });
