name: Work Quality Gate

on:
  workflow_run:
    workflows: ["Orderfly CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review after CI"
        required: true
        type: number

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

env:
  OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}

jobs:
  handle-ci-failure:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'workflow_dispatch' && startsWith(github.event.workflow_run.head_branch, 'work-issue-') && github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Work PR and issue from CI branch
        id: context
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const branch = context.payload.workflow_run.head_branch || '';
            const match = branch.match(/^work-issue-(\d+)$/);
            if (!match) return;
            const issueNumber = Number(match[1]);
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              base: 'develop',
              state: 'open',
              per_page: 10,
            });
            const pr = pulls.find(p => (p.body || '').includes(`Work-Managed-Issue: #${issueNumber}`));
            if (!pr) {
              core.setFailed(`No open Work-managed PR found for ${branch}`);
              return;
            }
            const { data: issue } = await github.rest.issues.get({owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber});
            core.setOutput('issue-number', String(issueNumber));
            core.setOutput('pr-number', String(pr.number));
            core.setOutput('clean-title', issue.title.replace(/^\[[^\]]+\]\s*/, ''));

      - name: Capture failed CI logs
        if: steps.context.outputs.issue-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > /tmp/work-ci-failure.log || true

      - name: Return CI failure to Work or block after repeated failures
        if: steps.context.outputs.issue-number != ''
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.context.outputs.issue-number }}
          CLEAN_TITLE: ${{ steps.context.outputs.clean-title }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const { data: comments } = await github.rest.issues.listComments({owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, per_page: 100});
            const retries = comments.filter(c => (c.body || '').includes('WORK_AUTO_RETRY:')).length;
            const raw = fs.existsSync('/tmp/work-ci-failure.log') ? fs.readFileSync('/tmp/work-ci-failure.log', 'utf8') : '';
            const excerpt = raw.slice(-9000) || 'No failed-job log text was available. Inspect the linked workflow run.';
            const blocked = retries >= 3;
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, body: `${blocked ? 'WORK_AUTOMATION_BLOCKED' : 'WORK_AUTO_RETRY:'} Orderfly CI/Playwright failed. Run: ${process.env.RUN_URL}\n\n<details><summary>Failed CI excerpt</summary>\n\n\`\`\`text\n${excerpt}\n\`\`\`\n</details>`});
            await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, title: `${blocked ? '[BLOCKED]' : '[READY FOR DEV]'} ${process.env.CLEAN_TITLE}`});
            if (!blocked) {
              await github.rest.actions.createWorkflowDispatch({owner: context.repo.owner, repo: context.repo.repo, workflow_id: 'work-developer.yml', ref: 'main', inputs: { issue_number: String(issueNumber) }});
            }

  review-and-handoff:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'workflow_dispatch' && startsWith(github.event.workflow_run.head_branch, 'work-issue-') && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Resolve Work PR and issue
        id: context
        uses: actions/github-script@v7
        env:
          MANUAL_PR_NUMBER: ${{ inputs.pr_number }}
        with:
          github-token: ${{ github.token }}
          script: |
            let pr;
            if (context.eventName === 'workflow_dispatch') {
              const prNumber = Number(process.env.MANUAL_PR_NUMBER);
              pr = (await github.rest.pulls.get({owner: context.repo.owner, repo: context.repo.repo, pull_number: prNumber})).data;
            } else {
              const branch = context.payload.workflow_run.head_branch || '';
              const branchMatch = branch.match(/^work-issue-(\d+)$/);
              if (!branchMatch) return;
              const issueNumberFromBranch = Number(branchMatch[1]);
              const { data: pulls } = await github.rest.pulls.list({owner: context.repo.owner, repo: context.repo.repo, head: `${context.repo.owner}:${branch}`, base: 'develop', state: 'open', per_page: 10});
              pr = pulls.find(p => (p.body || '').includes(`Work-Managed-Issue: #${issueNumberFromBranch}`));
              if (!pr) {
                core.setFailed(`No open Work-managed PR found for ${branch}`);
                return;
              }
            }
            const issueMatch = (pr.body || '').match(/Work-Managed-Issue:\s*#(\d+)/);
            if (!issueMatch) {
              core.setOutput('managed', 'false');
              return;
            }
            const issueNumber = Number(issueMatch[1]);
            const { data: issue } = await github.rest.issues.get({owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber});
            const { data: comments } = await github.rest.issues.listComments({owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, per_page: 100});
            const trustedComments = comments
              .filter(c => ['OWNER', 'MEMBER', 'COLLABORATOR'].includes(c.author_association) || c.user?.login === 'github-actions[bot]')
              .slice(-20)
              .map(c => c.body || '')
              .join('\n\n---\n\n');
            const fs = require('fs');
            fs.writeFileSync('.review-context.md', [
              '# Independent Orderfly code-review context',
              `Repository: ${context.repo.owner}/${context.repo.repo}`,
              `PR: #${pr.number}`,
              `Issue: #${issueNumber}`,
              '',
              '## Product specification and acceptance criteria',
              issue.body || '',
              '',
              '## PR description',
              pr.body || '',
              '',
              '## Trusted latest issue feedback',
              trustedComments || 'No trusted comments.',
            ].join('\n'));
            core.setOutput('managed', 'true');
            core.setOutput('issue-number', String(issueNumber));
            core.setOutput('pr-number', String(pr.number));
            core.setOutput('clean-title', issue.title.replace(/^\[[^\]]+\]\s*/, ''));

      - name: Check out PR merge result
        if: steps.context.outputs.managed == 'true'
        uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ steps.context.outputs.pr-number }}/merge
          fetch-depth: 0
          persist-credentials: false

      - name: Block managed PR when OpenAI API secret is missing
        if: steps.context.outputs.managed == 'true' && env.OPENAI_KEY == ''
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.context.outputs.issue-number }}
          CLEAN_TITLE: ${{ steps.context.outputs.clean-title }}
        with:
          github-token: ${{ github.token }}
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, title: `[BLOCKED] ${process.env.CLEAN_TITLE}`});
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, body: 'WORK_AUTOMATION_BLOCKED: CI passed, but independent Codex review cannot run because repository secret `OPENAI_API_KEY` is missing.'});
            core.setFailed('OPENAI_API_KEY is not configured.');

      - name: Independent Codex code review
        if: steps.context.outputs.managed == 'true' && env.OPENAI_KEY != ''
        id: review
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":read-only"
          allow-bots: true
          output-schema: |
            {
              "type": "object",
              "properties": {
                "verdict": {"type": "string", "enum": ["approve", "changes_requested"]},
                "summary": {"type": "string"},
                "findings": {"type": "array", "items": {"type": "string"}}
              },
              "required": ["verdict", "summary", "findings"],
              "additionalProperties": false
            }
          prompt: |
            Act as an independent senior code reviewer for Orderfly. Read `.review-context.md`, `AGENTS.md`, and the repository documentation. Review the PR merge result against `origin/develop` and every acceptance criterion in the linked issue.

            The explicitly dispatched Orderfly CI run, including typecheck/build and Playwright, is green. Do not assume that means the implementation is correct.

            Check especially for incomplete acceptance criteria, Firebase project mix-ups, authentication/tenant/brand isolation regressions, unsafe credential handling, data-flow errors, missing edge cases, weak tests, documentation drift and production/deployment risks.

            Return `approve` only when there are no material findings that should block PO acceptance. Otherwise return `changes_requested` with concrete findings. Do not modify files.

      - name: Apply review verdict and hand off to PO
        if: steps.context.outputs.managed == 'true' && env.OPENAI_KEY != ''
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.context.outputs.issue-number }}
          CLEAN_TITLE: ${{ steps.context.outputs.clean-title }}
          PR_NUMBER: ${{ steps.context.outputs.pr-number }}
          REVIEW_JSON: ${{ steps.review.outputs.final-message }}
        with:
          github-token: ${{ github.token }}
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const prNumber = Number(process.env.PR_NUMBER);
            let review;
            try { review = JSON.parse(process.env.REVIEW_JSON); }
            catch { throw new Error(`Invalid structured code-review output: ${process.env.REVIEW_JSON}`); }
            const body = [`## Independent Work code review: ${review.verdict === 'approve' ? 'APPROVED' : 'CHANGES REQUESTED'}`, '', review.summary, '', ...(review.findings?.length ? ['### Findings', ...review.findings.map(x => `- ${x}`)] : ['No blocking findings.'])].join('\n');
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber, body});
            if (review.verdict === 'approve') {
              await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, title: `[READY FOR PO] ${process.env.CLEAN_TITLE}`});
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, body: `WORK_READY_FOR_PO: Explicitly dispatched Orderfly CI, Playwright and independent code review are green for PR #${prNumber}. Awaiting PO acceptance and merge to develop. Staging live verification is required before Done.`});
              return;
            }
            const { data: comments } = await github.rest.issues.listComments({owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, per_page: 100});
            const retries = comments.filter(c => (c.body || '').includes('WORK_AUTO_RETRY:')).length;
            const blocked = retries >= 3;
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, body: `${blocked ? 'WORK_AUTOMATION_BLOCKED' : 'WORK_AUTO_RETRY:'} Independent code review requested changes on PR #${prNumber}.\n\n${body}`});
            await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, title: `${blocked ? '[BLOCKED]' : '[READY FOR DEV]'} ${process.env.CLEAN_TITLE}`});
            if (!blocked) {
              await github.rest.actions.createWorkflowDispatch({owner: context.repo.owner, repo: context.repo.repo, workflow_id: 'work-developer.yml', ref: 'main', inputs: { issue_number: String(issueNumber) }});
            }

      - name: Remove transient review context
        if: always()
        run: rm -f .review-context.md
